<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Play Stone & Banner, an offline-first turn-based strategy board game.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stone & Banner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stone & Banner</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#15252c">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; background: #15252c; }
    #stone-loading {
      position: fixed; inset: 0; z-index: 9999; display: grid;
      place-content: center; justify-items: center; gap: 18px;
      background: #15252c; color: #e5c183; font: 16px system-ui, sans-serif;
    }
    #stone-loading strong { font-size: 25px; letter-spacing: .03em; }
    #stone-loading small { color: #c0cbd0; }
    #stone-loading .spinner {
      width: 30px; height: 30px; border: 3px solid #41535b;
      border-top-color: #e5c183; border-radius: 50%;
      animation: stone-spin .8s linear infinite;
    }
    @keyframes stone-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #stone-loading .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <div id="stone-loading" role="status" aria-live="polite">
    <strong>Stone &amp; Banner</strong>
    <div class="spinner" aria-hidden="true"></div>
    <small id="stone-loading-message">Loading game…</small>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      performance.mark('stone-first-frame');
      document.getElementById('stone-loading')?.remove();
    }, { once: true });
    window.setTimeout(() => {
      const message = document.getElementById('stone-loading-message');
      if (message) message.textContent = 'Still loading…';
    }, 12000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="p2p.js?v=5"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

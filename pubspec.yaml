name: stone_and_banner
description: "Turn-based strategy game of villages, trading, guards, raids and multiplayer."
publish_to: none
version: 1.0.2+4063
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.4.1
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3
  http: ^1.5.0
  url_launcher: ^6.3.3
  flutter_webrtc: ^1.6.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/art/stone_banner_crest.jpg
    - assets/art/capital.png
    - assets/art/tabletop/
    - assets/icons/tabletop/
    - assets/icons/
    - assets/icons/banner/
    - assets/icons/treasury/
    - assets/icons/carved-stone/
    - assets/icons/game-icons/
    - assets/icons/mdi/
    - assets/icons/fluent-emoji-flat/
    - assets/icons/noto/
    - assets/icons/twemoji/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

name: Deploy Stone & Banner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Test P2P invitations and room authority
        run: flutter test test/p2p_links_test.dart test/p2p_bot_lobby_test.dart test/stage6_room_test.dart
      - name: Verify direct WebRTC ICE and response handshakes
        run: node --test tool/p2p_ice_test.js tool/p2p_answer_test.js
      - name: Build website
        run: flutter build web --release --base-href /stone-and-banner/
      - name: Bust browser bridge cache on each deployment
        run: sed -i "s|p2p.js?v=2|p2p.js?v=$GITHUB_SHA|" build/web/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

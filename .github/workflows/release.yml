name: Build releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and publish (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable version tag such as v1.0.0"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-22.04
          - platform: linux
            runner: ubuntu-22.04
          - platform: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - name: Verify package version matches release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          test "v$version" = "$RELEASE_TAG" || { echo "::error::Package version $version does not match $RELEASE_TAG"; exit 1; }
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev zip
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Select Android JDK
        if: matrix.platform == 'android'
        run: flutter config --jdk-dir "$JAVA_HOME"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Configure Flex Android signing
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
      - name: Build split Android APKs
        if: matrix.platform == 'android'
        shell: bash
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
            "$apksigner" verify --print-certs "$apk" | grep -F 'certificate SHA-256 digest: 011ee1a6e4e5ecd675f67fbf3d78ad82614a7a7a3f24ed71cc9c417154a0f0fd'
            cp "$apk" "dist/stone-and-banner-android-${abi}.apk"
          done
      - name: Build Linux ZIP
        if: matrix.platform == 'linux'
        run: |
          flutter build linux --release
          mkdir -p dist
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/dist/stone-and-banner-linux-x64.zip" .
          unzip -t "$GITHUB_WORKSPACE/dist/stone-and-banner-linux-x64.zip"
          test -x stone_and_banner
          test -f lib/libflutter_linux_gtk.so
          test -f data/flutter_assets/AssetManifest.bin
      - name: Build Windows ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/stone-and-banner-windows-x64.zip
          Expand-Archive -Path dist/stone-and-banner-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP/stone-release-check"
          foreach ($file in @('stone_and_banner.exe', 'flutter_windows.dll', 'data/flutter_assets/AssetManifest.bin')) {
            if (-not (Test-Path "$env:RUNNER_TEMP/stone-release-check/$file" -PathType Leaf)) { throw "Missing $file in Windows ZIP" }
          }
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  build-web:
    name: Build website
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - name: Install Node.js for signalling tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Test P2P invitations and room authority
        run: flutter test test/p2p_links_test.dart test/one_link_invites_test.dart test/p2p_signalling_diagnostics_test.dart test/p2p_bot_lobby_test.dart test/p2p_bot_long_run_test.dart test/p2p_trade_turn_ui_test.dart test/incoming_trade_modal_test.dart test/ai_turn_coordinator_test.dart test/broadcast_trade_test.dart test/multiplayer_playthrough_test.dart test/stage6_room_test.dart
      - name: Verify direct WebRTC ICE and response handshakes
        run: node --test tool/p2p_ice_test.js tool/p2p_answer_test.js
      - name: Test Cloudflare signalling Worker and diagnostics endpoint
        run: |
          npx --yes wrangler@4.166.0 dev --config wrangler.signalling.jsonc --port 8799 --ip 127.0.0.1 --local > /tmp/stone-signalling-ci.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -s --max-time 2 -o /dev/null http://127.0.0.1:8799/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/stone-signalling-ci.log
            exit 1
          fi
          node tool/signal_worker_smoke.mjs
      - name: Build website
        run: flutter build web --release --base-href /stone-and-banner/
      - name: Bust browser bridge cache on each deployment
        run: sed -i "s|p2p.js?v=5|p2p.js?v=$(git rev-parse HEAD)|" build/web/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Confirm unique indexed Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name=="github-pages")] | length')
            if [ "$count" -eq 1 ]; then
              echo "Pages artifact indexed and unique"
              sleep 3
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Duplicate Pages artifacts in one run"
              exit 1
            fi
            sleep 2
          done
          echo "::error::Pages artifact was not indexed"
          exit 1

  release:
    name: Publish release assets
    needs: [resolve, build, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify all release packages are present
        run: |
          for file in stone-and-banner-android-armeabi-v7a.apk stone-and-banner-android-arm64-v8a.apk stone-and-banner-android-x86_64.apk stone-and-banner-linux-x64.zip stone-and-banner-windows-x64.zip; do
            test -s "dist/$file" || { echo "Missing $file"; exit 1; }
          done
      - name: Create release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            python3 scripts/release_notes.py "release-notes/${RELEASE_TAG#v}.txt"
            gh release create "$RELEASE_TAG" --verify-tag --title "Stone & Banner ${RELEASE_TAG#v}" --notes-file "release-notes/${RELEASE_TAG#v}.txt" --draft
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest

  deploy-web:
    name: Deploy website to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

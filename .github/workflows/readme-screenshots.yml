name: Capture Stone & Banner screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'tool/capture_readme_screenshots.py'
      - '.github/workflows/readme-screenshots.yml'

permissions:
  contents: read

concurrency:
  group: game-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build local web game
        run: |
          flutter pub get
          flutter build web --release --base-href /
      - name: Install headless browser
        run: |
          python -m pip install patchright==1.64.4
          python -m patchright install --with-deps chromium
      - name: Play a game and capture screenshots
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory build/web > /tmp/stone-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8766/ > /dev/null; then break; fi
            sleep 1
          done
          python tool/capture_readme_screenshots.py --url http://127.0.0.1:8766/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stone-and-banner-screenshots
          path: docs/screenshots/*.png
          retention-days: 14
